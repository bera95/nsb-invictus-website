# Publishes the built website to the `production` branch.
# MANUAL ONLY: Actions → "Publish production" → Run workflow → type "publish".
#
# The `production` branch contains exactly what belongs in Hostinger's public_html
# (static site + api/inquiry.php + PHPMailer). Hostinger's Git deployment pulls it.
# History on `production` is preserved (no force-push), so every release can be rolled back.
name: Publish production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to update the production branch'
        required: true

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://nsbinvictus.tech
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify
      - run: php -l dist/api/inquiry.php

      - name: Install PHPMailer for the inquiry endpoint
        working-directory: dist/api
        run: |
          composer install --no-dev --no-interaction --no-progress --optimize-autoloader
          rm -f composer.json composer.lock

      - name: Publish to production branch (history preserved)
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "$REPO_URL" production >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch production "$REPO_URL" out
          else
            mkdir out && git -C out init -q -b production && git -C out remote add origin "$REPO_URL"
          fi
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. out/
          cd out
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes since the last production build."
            exit 0
          fi
          git commit -q -m "Production build from ${GITHUB_SHA::7}"
          git push origin HEAD:production
          echo "Published $(git rev-parse --short HEAD) to production."
