# Builds the site and publishes the production files to the `production` branch.
# Hostinger (hPanel → Websites → Advanced → GIT) deploys that branch into public_html.
# Source code (main) and deployment files (production) are kept separate.
name: Build & publish production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Lint PHP endpoint
        run: php -l dist/api/inquiry.php

      - name: Install PHPMailer for the inquiry endpoint
        working-directory: dist/api
        run: composer install --no-dev --no-interaction --optimize-autoloader && rm -f composer.lock

      - name: Publish to production branch
        working-directory: dist
        run: |
          git init -q
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Production build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:production
